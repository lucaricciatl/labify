      <text x="270" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" font-weight="600">Password</text>
      <rect x="270" y="108" width="240" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
