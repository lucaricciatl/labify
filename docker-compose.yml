services:
  labify:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labify
    environment:
      - LISTEN=${LISTEN:-0.0.0.0}
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: labify-api
    environment:
      - API_PORT=3000
      - DATABASE_PATH=/data/labify.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - EMAIL_SERVICE=${EMAIL_SERVICE:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - FROM_EMAIL=${FROM_EMAIL:-labify@localhost}
    ports:
      - "${HOST:-0.0.0.0}:${API_PORT:-3000}:3000"
    volumes:
      - labify-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  labify-data:
