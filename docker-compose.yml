services:
  labify:
    build: .
    container_name: labify
    environment:
      - LISTEN=${LISTEN:-0.0.0.0}
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
